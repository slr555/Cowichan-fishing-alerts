name: Cowichan fishing alert

on:
  schedule:
    # GitHub cron is UTC, so each run is listed twice (one for PDT, one for PST).
    # The script runs whichever matches today's clock and skips the other in seconds.
    - cron: "37 11 * * *"   # 4:37am PDT
    - cron: "37 12 * * *"   # 4:37am PST
    - cron: "7 0 * * *"     # 5:07pm PDT (Thursday's run adds the weekend outlook)
    - cron: "7 1 * * *"     # 5:07pm PST
  workflow_dispatch:
    inputs:
      weekend:
        description: "Also send the weekend outlook now"
        type: boolean
        default: false

permissions:
  contents: write   # lets the run commit state.json (alert memory) and the web page data

concurrency:
  group: cowichan-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Score conditions and alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALWAYS_SEND: ${{ vars.ALWAYS_SEND }}
          NTFY_TOPIC_FRIEND: ${{ secrets.NTFY_TOPIC_FRIEND }}
          FRIEND_ALERTS: ${{ vars.FRIEND_ALERTS }}
          FRIEND_SPECIES: ${{ vars.FRIEND_SPECIES }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 cowichan_alert.py ${{ inputs.weekend && '--weekend' || '' }}
      - name: Save alert state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "cowichan-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          [ -d docs ] && git add docs/*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Update alert state and web page data"
          # Rebase onto the latest branch first, so this works even if files changed
          # since the run started (e.g. you edited the script, or re-ran an old run).
          for i in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME" \
              && git rebase -q -X theirs FETCH_HEAD \
              && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::Could not save state.json this run; an alert may repeat once."
